@if (scaledPath) {
  @if (hasStopElements()) {
    @for (stopElement of getStopElements(); track stopElement) {
      <svg:g>
        <svg:circle
          [attr.cx]="stopElement.getX()"
          [attr.cy]="stopElement.getY()"
          r="1.5px"
          [attr.class]="getClassTag('edge_line_stops')"
        ></svg:circle>
        @if (checkIsCollapsedStops()) {
          <svg:text
            [attr.class]="getClassTag('edge_text stops')"
            [attr.x]="stopElement.getX() + 5"
            [attr.y]="stopElement.getY() + 8"
          >
            {{ getNumberOfStops() }}
          </svg:text>
        }
      </svg:g>
    }
  }
}
