<div class="ngx-html-editor">
  <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"> </ngx-editor-menu>

  <div class="ngx-html-editor-color-buttons">
    <button
      class="ngx-html-editor-color trash {{ setClassedTag(undefined) }}"
      [style]="getColorStyle(undefined)"
      (click)="onRemoveColor()"
      [title]="'app.view.dialogs.note-dialog.html-editor.reset-color' | translate"
    >
      <sbb-icon svgIcon="trash-small"></sbb-icon>
    </button>
    @for (color of colorPresets; track color) {
      <button
        class="NgxEditor__Color ngx-html-editor-color {{ setClassedTag(color) }}"
        (click)="onColor(color)"
        [title]="getColorTitle(color)"
        [style]="getColorStyle(color)"
        [ngClass]="{'NgxEditor__Color--Active': setActiveColor()}"
      >
        {{ getColorButtonText(color) }}
      </button>
    }
  </div>

  <ngx-editor
    cdkFocusInitial
    [editor]="editor"
    [formControl]="model.getControl('noteText')"
    [placeholder]="'app.view.dialogs.note-dialog.html-editor.editor-placeholder' | translate"
    (focusout)="onUpdate()"
    (keydown)="onKeydown($event)"
  ></ngx-editor>
  @if (model.getControl("noteText").errors?.required) {
    <sbb-error>{{
      "app.view.dialogs.note-dialog.html-editor.mandatory-field" | translate
    }}</sbb-error>
  }
</div>
