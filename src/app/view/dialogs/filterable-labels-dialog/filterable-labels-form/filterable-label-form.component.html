<div class="content">
  <sbb-form-field label="Name" class="sbb-form-field-long">
    <input
      type="text"
      sbbInput
      cdkFocusInitial
      [formControl]="model.getControl('name')"
      (focusout)="onUpdate()"
      (keydown)="onKeydown($event)"
      placeholder="Name"
    />
    @if (model.getControl("name").errors?.required) {
      <sbb-error>{{
        "app.view.dialogs.filterable-labels-dialog.filterable-labels-form.mandatory-field"
          | translate
      }}</sbb-error>
    }
  </sbb-form-field>
</div>
