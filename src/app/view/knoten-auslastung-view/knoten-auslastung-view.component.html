<div class="knotenAuslastungHourToggle" [class.has-external-label]="hasExternalLabel">
  <sbb-toggle-switch-button
    *ngIf="showHourToggle"
    [labelFalse]="'app.view.knoten-auslastung-view.even-hour' | translate"
    [labelTrue]="'app.view.knoten-auslastung-view.odd-hour' | translate"
    [checked]="oddHour"
    (checkedChanged)="onHourChanged($event)"
  ></sbb-toggle-switch-button>
</div>
<svg width="400px" height="300px" class="associations" #knotenAuslastungContainer></svg>
