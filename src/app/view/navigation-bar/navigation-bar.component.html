<div>
  <sbb-breadcrumbs>
    <a routerLink="/" routerLinkActive="sbb-active" sbb-breadcrumb-root></a>

    @for (definition of currentDefinitions; track definition) {
      <sbb-breadcrumb>
        <a [routerLink]="definition.route" routerLinkActive="sbb-active">
          @if (definition.name | async; as name) {
            {{ name }}
          } @else {
            ...
          }
        </a>
      </sbb-breadcrumb>
    }
  </sbb-breadcrumbs>
</div>
<hr />
